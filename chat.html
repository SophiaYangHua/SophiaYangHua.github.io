<body>
<div class="chat-container">
  <div class="chat-header">
    <h1>AI 聊天助手</h1>
    <div class="header-actions">
      <button class="new-chat-btn" onclick="newChat()" title="新建对话">+ 新对话</button>
      <button class="settings-btn" onclick="toggleSettings()" title="设置">⚙️</button>
    </div>
  </div>

  <div class="chat-messages" id="chatMessages">
    <div class="empty-state" id="emptyState">
      <div class="icon">💬</div>
      <h3>开始你的 AI 对话</h3>
      <p>直接在下方输入框开始聊天吧<br>点击右上角 ⚙️ 可以切换模型或设置</p>
    </div>
  </div>

  <div class="chat-input-area">
    <div class="input-wrapper">
      <textarea
        class="chat-input"
        id="chatInput"
        placeholder="输入消息，按 Enter 发送，Shift+Enter 换行..."
        rows="1"
      ></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()" title="发送">
        ➤
      </button>
    </div>
  </div>

  <!-- Settings Panel -->
  <div class="settings-panel" id="settingsPanel">
    <div class="settings-header">
      <h2>⚙️ API 设置</h2>
      <button class="close-btn" onclick="toggleSettings()">&times;</button>
    </div>
    <div class="settings-body">
      <div class="status-indicator" id="statusIndicator">
        <span class="status-dot"></span>
        <span id="statusText">未配置</span>
      </div>

      <div class="form-group">
        <label>API 基础地址 (Base URL)</label>
        <input type="text" id="apiBaseUrl" placeholder="https://api.example.com/v1">
        <div class="hint">填到 /v1 即可，例如 https://api.xxx.com/ai/v1</div>
      </div>

      <div class="form-group">
        <label>API Token</label>
        <input type="password" id="apiToken" placeholder="sk-... 或你的 token">
        <div class="hint">你的 API 密钥，仅保存在本地浏览器</div>
      </div>

      <div class="form-group">
        <label>模型名称</label>
        <input type="text" id="modelName" placeholder="gpt-3.5-turbo">
        <div class="hint">要使用的模型 ID</div>
      </div>

      <div class="form-group">
        <label>流式输出</label>
        <select id="streamMode">
          <option value="true">开启（打字机效果）</option>
          <option value="false">关闭</option>
        </select>
      </div>

      <div class="form-group">
        <label>系统提示词 (可选)</label>
        <input type="text" id="systemPrompt" placeholder="你是一个乐于助人的AI助手">
        <div class="hint">设置 AI 的角色和行为</div>
      </div>

      <button class="save-btn" onclick="saveSettings()">保存设置</button>
    </div>
  </div>
</div>

<script>
  // 默认配置（访客一进来就能用）
  const DEFAULT_SETTINGS = {
    baseUrl: 'https://api.sillytraven.dev/api/ai/v1',
    token: 'd332d9ed-3446-486f-b9a3-2272c7dd8d11',
    model: 'x-apex-surge-0505-16k',
    stream: true,
    systemPrompt: '你是一个乐于助人的AI助手，回答简洁明了，善于思考。'
  };

  // State
  let messages = [];
  let isSending = false;
  let controller = null;
  let currentSettings = { ...DEFAULT_SETTINGS };

  // 加载设置：每次刷新都用默认值，访客自己改的只在当前页面生效
  function loadSettings() {
    currentSettings = { ...DEFAULT_SETTINGS };
    document.getElementById('apiBaseUrl').value = currentSettings.baseUrl;
    document.getElementById('apiToken').value = currentSettings.token;
    document.getElementById('modelName').value = currentSettings.model;
    document.getElementById('streamMode').value = currentSettings.stream ? 'true' : 'false';
    document.getElementById('systemPrompt').value = currentSettings.systemPrompt;
    updateStatus();
  }

  function saveSettings() {
    currentSettings = {
      baseUrl: document.getElementById('apiBaseUrl').value.trim(),
      token: document.getElementById('apiToken').value.trim(),
      model: document.getElementById('modelName').value.trim(),
      stream: document.getElementById('streamMode').value === 'true',
      systemPrompt: document.getElementById('systemPrompt').value.trim()
    };
    // 不存 localStorage，刷新后恢复默认
    updateStatus();
    toggleSettings();
    showToast('设置已保存 ✓');
  }

  function getSettings() {
    return currentSettings;
  }

  function updateStatus() {
    const s = getSettings();
    const indicator = document.getElementById('statusIndicator');
    const text = document.getElementById('statusText');
    const ready = s.baseUrl && s.token && s.model;
    indicator.className = 'status-indicator ' + (ready ? 'ready' : 'not-ready');
    text.textContent = ready ? '已就绪' : '请填写 API 配置';
  }

  function toggleSettings() {
    document.getElementById('settingsPanel').classList.toggle('open');
  }

  function showToast(msg) {
    const toast = document.createElement('div');
    toast.style.cssText = `
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.8); color: white; padding: 10px 20px;
      border-radius: 8px; font-size: 14px; z-index: 1000;
      animation: fadeIn 0.3s ease;
    `;
    toast.textContent = msg;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 2000);
  }

  function newChat() {
    if (messages.length > 0 && !confirm('确定要开始新对话吗？当前对话记录将被清空。')) {
      return;
    }
    messages = [];
    renderMessages();
  }

  function renderMessages() {
    const container = document.getElementById('chatMessages');
    const emptyState = document.getElementById('emptyState');

    if (messages.length === 0) {
      container.innerHTML = '';
      container.appendChild(emptyState);
      emptyState.style.display = 'flex';
      return;
    }

    container.innerHTML = '';
    messages.forEach((msg, index) => {
      if (msg.role === 'system') return;
      addMessageToDOM(msg.role, msg.content, false);
    });
    scrollToBottom();
  }

  function addMessageToDOM(role, content, animate = true) {
    const container = document.getElementById('chatMessages');
    const emptyState = document.getElementById('emptyState');
    if (emptyState && emptyState.parentNode) {
      emptyState.remove();
    }

    const msgDiv = document.createElement('div');
    msgDiv.className = `message ${role}`;
    if (!animate) msgDiv.style.animation = 'none';

    const avatar = document.createElement('div');
    avatar.className = 'message-avatar';
    avatar.textContent = role === 'user' ? '🧑' : '🤖';

    const bubble = document.createElement('div');
    bubble.className = 'message-bubble';
    bubble.textContent = content;

    msgDiv.appendChild(avatar);
    msgDiv.appendChild(bubble);
    container.appendChild(msgDiv);
    scrollToBottom();

    return bubble;
  }

  function addTypingIndicator() {
    const container = document.getElementById('chatMessages');
    const msgDiv = document.createElement('div');
    msgDiv.className = 'message assistant';
    msgDiv.id = 'typingIndicator';

    const avatar = document.createElement('div');
    avatar.className = 'message-avatar';
    avatar.textContent = '🤖';

    const bubble = document.createElement('div');
    bubble.className = 'message-bubble';
    bubble.innerHTML = '<div class="typing-indicator"><span></span><span></span><span></span></div>';

    msgDiv.appendChild(avatar);
    msgDiv.appendChild(bubble);
    container.appendChild(msgDiv);
    scrollToBottom();
  }

  function removeTypingIndicator() {
    const el = document.getElementById('typingIndicator');
    if (el) el.remove();
  }

  function scrollToBottom() {
    const container = document.getElementById('chatMessages');
    container.scrollTop = container.scrollHeight;
  }

  async function sendMessage() {
    if (isSending) return;

    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if (!text) return;

    const settings = getSettings();
    if (!settings.baseUrl || !settings.token || !settings.model) {
      showToast('请先在设置中配置 API 信息');
      toggleSettings();
      return;
    }

    // Add user message
    messages.push({ role: 'user', content: text });
    addMessageToDOM('user', text);
    input.value = '';
    autoResize();

    // Show typing indicator
    addTypingIndicator();
    isSending = true;
    document.getElementById('sendBtn').disabled = true;

    try {
      let baseUrl = settings.baseUrl.replace(/\/$/, '');
      // 如果用户填的地址已经包含 /chat/completions，就不再重复拼接
      const url = baseUrl.endsWith('/chat/completions')
        ? baseUrl
        : `${baseUrl}/chat/completions`;

      // Build messages array including system prompt
      const requestMessages = [];
      if (settings.systemPrompt) {
        requestMessages.push({ role: 'system', content: settings.systemPrompt });
      }
      requestMessages.push(...messages);

      if (settings.stream) {
        await streamRequest(url, settings.token, settings.model, requestMessages);
      } else {
        await normalRequest(url, settings.token, settings.model, requestMessages);
      }
    } catch (error) {
      removeTypingIndicator();
      addMessageToDOM('assistant', '❌ 出错了：' + error.message);
      messages.push({ role: 'assistant', content: '❌ 出错了：' + error.message });
    } finally {
      isSending = false;
      document.getElementById('sendBtn').disabled = false;
      input.focus();
    }
  }

  async function normalRequest(url, token, model, requestMessages) {
    const response = await fetch(url, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${token}`
      },
      body: JSON.stringify({
        model: model,
        messages: requestMessages
      })
    });

    if (!response.ok) {
      const errText = await response.text();
      throw new Error(`HTTP ${response.status}: ${errText}`);
    }

    const data = await response.json();
    const content = data.choices[0].message.content;

    removeTypingIndicator();
    addMessageToDOM('assistant', content);
    messages.push({ role: 'assistant', content });
  }

  async function streamRequest(url, token, model, requestMessages) {
    controller = new AbortController();

    const response = await fetch(url, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${token}`
      },
      body: JSON.stringify({
        model: model,
        messages: requestMessages,
        stream: true
      }),
      signal: controller.signal
    });

    if (!response.ok) {
      const errText = await response.text();
      throw new Error(`HTTP ${response.status}: ${errText}`);
    }

    removeTypingIndicator();
    const bubble = addMessageToDOM('assistant', '');
    let fullContent = '';

    const reader = response.body.getReader();
    const decoder = new TextDecoder('utf-8');
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();

      for (const line of lines) {
        const trimmed = line.trim();
        if (!trimmed || !trimmed.startsWith('data:')) continue;

        const dataStr = trimmed.slice(5).trim();
        if (dataStr === '[DONE]') continue;

        try {
          const data = JSON.parse(dataStr);
          const delta = data.choices?.[0]?.delta?.content;
          if (delta) {
            fullContent += delta;
            bubble.textContent = fullContent;
            scrollToBottom();
          }
        } catch (e) {
          // Ignore parse errors
        }
      }
    }

    messages.push({ role: 'assistant', content: fullContent });
    controller = null;
  }

  // Auto resize textarea
  function autoResize() {
    const input = document.getElementById('chatInput');
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  }

  // Keyboard shortcuts
  document.getElementById('chatInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  document.getElementById('chatInput').addEventListener('input', autoResize);

  // Close settings when clicking outside
  document.addEventListener('click', function(e) {
    const panel = document.getElementById('settingsPanel');
    const settingsBtn = document.querySelector('.settings-btn');
    if (panel.classList.contains('open') &&
        !panel.contains(e.target) &&
        !settingsBtn.contains(e.target)) {
      panel.classList.remove('open');
    }
  });

  // Initialize
  loadSettings();

  // If token is already in settings from the screenshot, pre-fill suggestion
  // (User will need to enter their own base URL)
</script>
